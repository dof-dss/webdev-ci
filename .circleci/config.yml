version: 2.1

executors:
  config-validator:
    docker:
      - image: cimg/python:3.9

commands:
  install-circleci-cli:
    steps:
      - run:
          name: Install CircleCI CLI
          command: curl -fLSs https://circle.ci/cli | sudo bash

jobs:
  validate-legacy-config:
    executor: config-validator
    steps:
      - checkout
      - run:
          name: Install legacy YAML linter
          command: pip install --quiet yamllint
      - run:
          name: Lint legacy config and validation fixture
          command: yamllint -c .yamllint.yml shared-config.yml .circleci/fixtures/legacy-workflows.yml
      - run:
          name: Reject unescaped Bash here-strings in legacy config
          command: |
            if grep -nE '(^|[^\\])<{3}' shared-config.yml; then
              echo 'Bash here-strings must escape the CircleCI config marker as \<<<.' >&2
              exit 1
            fi
      - install-circleci-cli
      - run:
          name: Compile legacy jobs without running them
          command: |
            cat shared-config.yml .circleci/fixtures/legacy-workflows.yml > /tmp/legacy-ci.yml
            circleci config validate /tmp/legacy-ci.yml

  validate-application-config:
    executor: config-validator
    steps:
      - checkout
      - run:
          name: Install application validation dependencies
          command: pip install --quiet yamllint PyYAML==6.0.3
      - install-circleci-cli
      - run:
          name: Test new application workflows offline
          command: |
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_application_ci.py
            for script in scripts/edge/*.sh; do bash -n "$script"; done
            yamllint -c .yamllint.yml config/application examples/application/setup.yml examples/unity1/setup.yml
      - run:
          name: Pack and compile new application workflows
          command: |
            circleci config pack config/application > /tmp/application-ci.yml
            circleci config validate /tmp/application-ci.yml
            for parameters in examples/application/*.json examples/unity1/parameters.json; do
              for action in checks edge-build edge-refresh; do
                jq --arg action "$action" '.ci_action = $action' \
                  "$parameters" > /tmp/application-parameters.json
                circleci config process /tmp/application-ci.yml \
                  --pipeline-parameters /tmp/application-parameters.json > /tmp/application-processed.yml
              done
            done

workflows:
  validate-configurations:
    jobs:
      - validate-legacy-config
      - validate-application-config
