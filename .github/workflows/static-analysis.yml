name: Drupal static analysis

on:
  workflow_call:
    inputs:
      php_version:
        required: false
        type: string
        default: '8.3'
      php_ini_memory_limit:
        required: false
        type: string
        default: '1G'
      coding_standards_dirs:
        required: true
        type: string
      deprecated_code_dirs:
        required: true
        type: string
      disallowed_functions_dirs:
        required: true
        type: string
      phpunit_args:
        required: false
        type: string
        default: ''
      unit_tests_phpunit_config:
        required: false
        type: string
        default: 'web/core/phpunit.xml.dist'
      ignore_dirs:
        required: false
        type: string
        default: ''
      phpcs_helper_ref:
        required: false
        type: string
        default: 'development'

permissions:
  contents: read

env:
  PROJECT_ROOT: ${{ github.workspace }}
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_AUDIT: 1
  BUILD_ARTIFACT_NAME: build-workspace
  SYMFONY_DEPRECATIONS_HELPER: weak

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: mbstring, xml, gd, intl, zip
          coverage: none
          tools: composer

      - name: Cache Composer files
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Upload build workspace
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          retention-days: 1
          if-no-files-found: error
          path: |
            .
            !.git
            !.github
            !node_modules
            !**/node_modules

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build workspace
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}

      - name: Restore vendor bin permissions
        shell: bash
        run: |
          set -euo pipefail
          if [ -d vendor/bin ]; then
            chmod +x vendor/bin/* || true
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: mbstring, xml
          coverage: none
          tools: composer

      - name: PHPCS analysis for pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin "${BASE_REF}" --depth=1

          if ! git diff --name-only "origin/${BASE_REF}...HEAD" \
            | grep -qE '^(web/modules|web/themes|web/profiles)/.*\.(php|module|inc|install|theme|profile)$'; then
            echo "No changed PHP files requiring PHPCS."
            exit 0
          fi

          RAW_URL="https://raw.githubusercontent.com/johangant/webdev-ci/${{ inputs.phpcs_helper_ref }}/phpcs.sh"
          curl -fsSL "${RAW_URL}" -o /tmp/phpcs.sh
          chmod +x /tmp/phpcs.sh

          exec /tmp/phpcs.sh "${PROJECT_ROOT}" "${{ inputs.coding_standards_dirs }}" "${{ inputs.ignore_dirs }}"

      - name: PHPCS analysis for pushes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          RAW_URL="https://raw.githubusercontent.com/johangant/webdev-ci/${{ inputs.phpcs_helper_ref }}/phpcs.sh"
          curl -fsSL "${RAW_URL}" -o /tmp/phpcs.sh
          chmod +x /tmp/phpcs.sh

          exec /tmp/phpcs.sh "${PROJECT_ROOT}" "${{ inputs.coding_standards_dirs }}" "${{ inputs.ignore_dirs }}"

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    if: inputs.phpunit_args != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build workspace
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}

      - name: Restore vendor bin permissions
        shell: bash
        run: |
          set -euo pipefail
          if [ -d vendor/bin ]; then
            chmod +x vendor/bin/* || true
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: mbstring, xml, gd
          coverage: none
          tools: composer

      - name: Run PHPUnit unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_ROOT}"

          PHPUNIT_CONFIG="${{ inputs.unit_tests_phpunit_config }}"
          if [[ "${PHPUNIT_CONFIG}" != /* ]]; then
            PHPUNIT_CONFIG="${PROJECT_ROOT}/${PHPUNIT_CONFIG}"
          fi

          echo "Using PHPUnit config: ${PHPUNIT_CONFIG}"
          if [[ ! -f "${PHPUNIT_CONFIG}" ]]; then
            echo "PHPUnit config file not found: ${PHPUNIT_CONFIG}" >&2
            exit 1
          fi

          sed -i -E 's#^([[:space:]]*)(<env name="BROWSERTEST_OUTPUT_DIRECTORY" value="[^"]*"/>)#\1<!-- \2 -->#' "${PHPUNIT_CONFIG}"

          php vendor/bin/phpunit \
            -c "${PHPUNIT_CONFIG}" \
            ${{ inputs.phpunit_args }}

  phpstan-deprecated:
    name: PHPStan deprecated code
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build workspace
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}

      - name: Restore vendor bin permissions
        shell: bash
        run: |
          set -euo pipefail
          if [ -d vendor/bin ]; then
            chmod +x vendor/bin/* || true
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: mbstring, xml, gd
          coverage: none
          tools: composer

      - name: Run deprecated code PHPStan
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_ROOT}"
          php vendor/bin/phpstan analyse \
            --memory-limit="${{ inputs.php_ini_memory_limit }}" \
            ${{ inputs.deprecated_code_dirs }}

  phpstan-disallowed-functions:
    name: PHPStan disallowed functions
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build workspace
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}

      - name: Restore vendor bin permissions
        shell: bash
        run: |
          set -euo pipefail
          if [ -d vendor/bin ]; then
            chmod +x vendor/bin/* || true
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: mbstring, xml, gd
          coverage: none
          tools: composer

      - name: Run disallowed functions PHPStan
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_ROOT}"

          if [ -f "phpstan-disallowed.neon" ]; then
            php vendor/bin/phpstan analyse \
              -c phpstan-disallowed.neon \
              --memory-limit="${{ inputs.php_ini_memory_limit }}" \
              ${{ inputs.disallowed_functions_dirs }}
          else
            echo "phpstan-disallowed.neon not found, skipping."
            exit 0
          fi
