commands:
    checkout_code:
        description: Handle composer access tokens, SSH key fingerprints and code checkout
        parameters:
            ssh_fingerprint:
                default: ""
                type: string
        steps:
            - add_ssh_keys:
                fingerprints:
                    - << parameters.ssh_fingerprint >>
            - checkout
    composer_tasks:
        description: Validate and install dependencies using composer
        steps:
            - run:
                command: composer validate --no-check-all --strict
                name: Validate composer.json and composer.lock file for consistency
            - restore_cache:
                keys:
                    - composer-vendor-{{ checksum "composer.lock" }}
            - run:
                command: |
                    composer install --no-interaction --optimize-autoloader
                name: Install dependencies
            - save_cache:
                key: composer-vendor-{{ checksum "composer.lock" }}
                paths:
                    - vendor
                    - ~/.composer/cache
    hosts_keyscan:
        description: Keyscan for hosts that require SSH access
        steps:
            - run:
                command: |
                    mkdir -p ~/.ssh
                    ssh-keyscan -H github.com >> ~/.ssh/known_hosts
                    ssh-keyscan -H ssh.$PLATFORM_REGION >> ~/.ssh/known_hosts
                name: Keyscan for hosts that require SSH access
    install_psh_cli:
        description: Install the Platform.sh CLI tool
        steps:
            - run:
                command: curl -sS https://platform.sh/cli/installer | php
                name: Install the Platform.sh CLI tool
            - run:
                command: echo 'export PATH="$HOME/"'.platformsh/bin':"$PATH"' >> $BASH_ENV
                name: Add platform cli tool to $PATH
    prepare_shared_tools:
        steps:
            - run:
                command: |
                    set -euo pipefail
                    shared_dir=$(mktemp -d /tmp/webdev-ci.XXXXXX)
                    curl -fsSL "https://github.com/dof-dss/webdev-ci/archive/refs/heads/main.tar.gz" \
                      | tar -xz --strip-components=1 -C "$shared_dir"
                    printf 'export CI_SHARED_TOOLS=%q\n' "$shared_dir/scripts/edge" >> "$BASH_ENV"
                    printf 'export CI_SHARED_ROOT=%q\n' "$shared_dir" >> "$BASH_ENV"
                name: Load latest shared scripts from main
jobs:
    build:
        docker:
            - environment:
                PHP_EXTENSION_GD: 1
                PHP_INI_MEMORY_LIMIT: 1g
                PLATFORM_REGION: uk-1.platform.sh
                PROJECT_ROOT: /home/docker/project
              image: thecodingmachine/php:<< parameters.php_version >>-v4-fpm
        parameters:
            php_version:
                type: string
            ssh_fingerprint:
                type: string
        shell: /bin/bash -euo pipefail
        steps:
            - checkout_code:
                ssh_fingerprint: << parameters.ssh_fingerprint >>
            - composer_tasks
            - persist_to_workspace:
                paths:
                    - ./
                root: ./
    check_illegal_updates:
        docker:
            - environment:
                PLATFORM_REGION: uk-1.platform.sh
              image: thecodingmachine/php:<< parameters.php_version >>-v4-fpm
        parameters:
            php_version:
                type: string
        shell: /bin/bash -euo pipefail
        steps:
            - attach_workspace:
                at: ./
            - hosts_keyscan
            - run:
                command: |
                    git clone git@github.com:dof-dss/maestro-drupal-unity.git
                    echo "** Any failures in this section indicate that updates have been made directly in this repo "
                    echo "when they should have been made in https://github.com/dof-dss/maestro-drupal-unity and"
                    echo "pulled from the upstream repo using 'maestro pub' **"
                    echo "** checking composer.json  **"
                    diff maestro-drupal-unity/composer.json composer.json
                    echo "** checking composer.lock  **"
                    diff maestro-drupal-unity/composer.lock composer.lock
                    echo "** checking circleci/config.yml  **"
                    #diff maestro-drupal-unity/.circleci/config.yml .circleci/config.yml
                    echo "** checking platform.app.yaml **"
                    grep 'will be overwritten' .platform.app.yaml
                    echo "** checking site.settings.php  **"
                    diff maestro-drupal-unity/web/sites/site.settings.php web/sites/site.settings.php
                    echo "** checking sites.php  **"
                    diff maestro-drupal-unity/web/sites/sites.php web/sites/sites.php
                name: Check for updates made directly in this repo rather than in maestro-drupal-unity
    coding_standards:
        docker:
            - environment:
                PHP_EXTENSION_GD: 1
                PHP_INI_MEMORY_LIMIT: 1g
                PLATFORM_REGION: uk-1.platform.sh
                PROJECT_ROOT: /home/docker/project
              image: thecodingmachine/php:<< parameters.php_version >>-v4-fpm
        parameters:
            coding_standards_dirs:
                type: string
            ignore_dirs:
                type: string
            php_version:
                type: string
        shell: /bin/bash -euo pipefail
        steps:
            - attach_workspace:
                at: ./
            - prepare_shared_tools
            - run:
                command: |
                    DRUPAL_DEPLOY_PATH="${PROJECT_ROOT}"
                    PHPCS_CHECK_DIRS="<< parameters.coding_standards_dirs >>"
                    IGNORE_DIRS="<< parameters.ignore_dirs >>"
                    exec bash "$CI_SHARED_ROOT/phpcs.sh" "${DRUPAL_DEPLOY_PATH}" "${PHPCS_CHECK_DIRS}" "${IGNORE_DIRS}"
                name: PHPCS analysis
                shell: /bin/bash -eo pipefail
    deprecated_code_phpstan:
        docker:
            - environment:
                PHP_EXTENSION_GD: 1
                PHP_INI_MEMORY_LIMIT: 1g
                PLATFORM_REGION: uk-1.platform.sh
                PROJECT_ROOT: /home/docker/project
              image: thecodingmachine/php:<< parameters.php_version >>-v4-fpm
        parameters:
            deprecated_code_dirs:
                type: string
            php_version:
                type: string
        shell: /bin/bash -euo pipefail
        steps:
            - attach_workspace:
                at: ./
            - run:
                command: cd $PROJECT_ROOT && vendor/bin/phpstan analyse --memory-limit=$PHP_INI_MEMORY_LIMIT << parameters.deprecated_code_dirs >>
                name: Deprecated code check
    disallowed_functions:
        docker:
            - environment:
                PHP_INI_MEMORY_LIMIT: 1g
                PROJECT_ROOT: /home/docker/project
              image: thecodingmachine/php:<< parameters.php_version >>-v4-fpm
        parameters:
            custom_code_dirs:
                type: string
            php_version:
                type: string
        shell: /bin/bash -euo pipefail
        steps:
            - attach_workspace:
                at: ./
            - run:
                command: vendor/bin/phpstan analyse << parameters.custom_code_dirs >> -c .circleci/phpstan.neon
                name: Check for disallowed function calls
    edge_build_shared:
        docker:
            - environment:
                CPPFLAGS: -DPNG_ARM_NEON_OPT=0
                EDGE_BRANCH: << pipeline.parameters.edge_branch >>
                EDGE_PACKAGES: << pipeline.parameters.edge_build_dofdss_packages >>
                PHP_EXTENSION_GD: 1
                PHP_INI_MEMORY_LIMIT: -1
                SOURCE_BRANCH: << pipeline.parameters.source_branch >>
                THEME_ASSET_PATHS: << pipeline.parameters.theme_asset_paths >>
                THEME_BUILD_SCRIPT: << pipeline.parameters.theme_build_script >>
                THEME_SITES_DIR: << pipeline.parameters.theme_sites_dir >>
              image: thecodingmachine/php:<< parameters.php_version >>-v4-fpm
        parameters:
            build_themes:
                default: false
                type: boolean
            node_version:
                default: "18"
                type: string
            php_version:
                type: string
            ssh_fingerprint:
                default: ""
                type: string
        shell: /bin/bash -euo pipefail
        steps:
            - checkout_code:
                ssh_fingerprint: << parameters.ssh_fingerprint >>
            - prepare_shared_tools
            - when:
                condition: << parameters.build_themes >>
                steps:
                    - run:
                        command: |
                            touch ~/.bashrc
                            curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.5/install.sh | bash
                            sudo apt-get update
                            sudo apt-get install -y libjpeg-dev make python3 g++ dh-autoreconf
                            export NVM_DIR="$HOME/.nvm"
                            source "$NVM_DIR/nvm.sh"
                            nvm install << parameters.node_version >>
                            nvm use << parameters.node_version >>
                            printf 'export PATH=%q\n' "$PATH" >> "$BASH_ENV"
                        name: Prepare existing theme toolchain
            - run:
                command: bash "$CI_SHARED_TOOLS/build.sh"
                name: Prepare and publish Edge code and optional assets
                no_output_timeout: 20m
    edge_refresh_shared:
        docker:
            - environment:
                EDGE_AFTER_COMMAND: << pipeline.parameters.after_command >>
                EDGE_BRANCH: << pipeline.parameters.edge_branch >>
                EDGE_CONTENT: << pipeline.parameters.content >>
                EDGE_DEPLOY: << pipeline.parameters.deploy >>
                EDGE_ENVIRONMENT: << pipeline.parameters.environment >>
                EDGE_FASTLY: << pipeline.parameters.fastly >>
                EDGE_LAYOUT: << pipeline.parameters.layout >>
                EDGE_PREFLIGHT: << pipeline.parameters.preflight >>
                EDGE_QA_STAFF: << pipeline.parameters.qa_staff >>
                EDGE_SITE_HOOK: << pipeline.parameters.site_hook >>
                EDGE_SITES: << pipeline.parameters.sites >>
                EDGE_URI: << pipeline.parameters.uri >>
                PHP_EXTENSION_GD: 1
              image: thecodingmachine/php:<< parameters.php_version >>-v4-fpm
        parameters:
            php_version:
                type: string
            ssh_fingerprint:
                default: ""
                type: string
        shell: /bin/bash -euo pipefail
        steps:
            - checkout_code:
                ssh_fingerprint: << parameters.ssh_fingerprint >>
            - prepare_shared_tools
            - install_psh_cli
            - run:
                command: bash "$CI_SHARED_TOOLS/refresh.sh"
                name: Sync parent data and finalise all sites
                no_output_timeout: 30m
parameters:
    after_command:
        default: ""
        type: string
    build_themes:
        default: false
        type: boolean
    check_illegal_updates:
        default: false
        type: boolean
    ci_action:
        default: auto
        enum:
            - auto
            - checks
            - edge-build
            - edge-refresh
        type: enum
    coding_standards_dirs:
        default: ""
        type: string
    content:
        default: none
        enum:
            - none
            - unity
            - structure-sync
        type: enum
    custom_code_dirs:
        default: ""
        type: string
    deploy:
        default: standard
        enum:
            - standard
            - deploy
        type: enum
    deprecated_code_dirs:
        default: ""
        type: string
    drupal_core_version:
        default: "10.4"
        type: string
    edge_branch:
        default: ""
        type: string
    edge_build_dofdss_packages:
        default: ""
        type: string
    environment:
        default: ""
        type: string
    fastly:
        default: keep
        enum:
            - keep
            - uninstall
        type: enum
    ignore_dirs:
        default: ""
        type: string
    layout:
        default: single
        enum:
            - single
            - multisite
        type: enum
    node_version:
        default: "18"
        type: string
    php_version:
        default: "8.3"
        type: string
    preflight:
        default: none
        enum:
            - none
            - required
        type: enum
    qa_staff:
        default: false
        type: boolean
    site_hook:
        default: ""
        type: string
    sites:
        default: ""
        type: string
    source_branch:
        default: development
        type: string
    ssh_fingerprint:
        default: ""
        type: string
    supporting_repo_dependent_packages:
        default: ""
        type: string
    theme_asset_paths:
        default: ""
        type: string
    theme_build_script:
        default: ""
        type: string
    theme_sites_dir:
        default: project/sites
        type: string
    uri:
        default: default
        type: string
version: 2.1
workflows:
    build-edge:
        jobs:
            - edge_build_shared:
                build_themes: << pipeline.parameters.build_themes >>
                node_version: << pipeline.parameters.node_version >>
                php_version: << pipeline.parameters.php_version >>
                ssh_fingerprint: << pipeline.parameters.ssh_fingerprint >>
        when:
            or:
                - equal:
                    - edge-build
                    - << pipeline.parameters.ci_action >>
                - and:
                    - equal:
                        - auto
                        - << pipeline.parameters.ci_action >>
                    - equal:
                        - scheduled_pipeline
                        - << pipeline.trigger_source >>
                    - equal:
                        - edge_build
                        - << pipeline.schedule.name >>
    build-edge-finalise:
        jobs:
            - edge_refresh_shared:
                php_version: << pipeline.parameters.php_version >>
                ssh_fingerprint: << pipeline.parameters.ssh_fingerprint >>
        when:
            or:
                - equal:
                    - edge-refresh
                    - << pipeline.parameters.ci_action >>
                - and:
                    - equal:
                        - auto
                        - << pipeline.parameters.ci_action >>
                    - equal:
                        - scheduled_pipeline
                        - << pipeline.trigger_source >>
                    - equal:
                        - edge_build_finalise
                        - << pipeline.schedule.name >>
    build-test:
        jobs:
            - build:
                php_version: << pipeline.parameters.php_version >>
                ssh_fingerprint: << pipeline.parameters.ssh_fingerprint >>
            - coding_standards:
                coding_standards_dirs: << pipeline.parameters.coding_standards_dirs >>
                ignore_dirs: << pipeline.parameters.ignore_dirs >>
                php_version: << pipeline.parameters.php_version >>
                requires:
                    - build
            - deprecated_code_phpstan:
                deprecated_code_dirs: << pipeline.parameters.deprecated_code_dirs >>
                php_version: << pipeline.parameters.php_version >>
                requires:
                    - build
            - disallowed_functions:
                custom_code_dirs: << pipeline.parameters.custom_code_dirs >>
                php_version: << pipeline.parameters.php_version >>
                requires:
                    - build
            - check_illegal_updates:
                filters: pipeline.parameters.check_illegal_updates
                php_version: << pipeline.parameters.php_version >>
                requires:
                    - build
        when:
            or:
                - equal:
                    - checks
                    - << pipeline.parameters.ci_action >>
                - and:
                    - equal:
                        - auto
                        - << pipeline.parameters.ci_action >>
                    - not:
                        equal:
                            - << pipeline.parameters.source_branch >>
                            - << pipeline.git.branch >>
                    - not:
                        equal:
                            - scheduled_pipeline
                            - << pipeline.trigger_source >>
                    - not:
                        equal:
                            - api
                            - << pipeline.trigger_source >>
