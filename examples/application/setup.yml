# Consumer template: copy one example parameter map to .circleci/application.json
# Shared configuration and scripts are fetched from the latest main.
version: 2.1
setup: true
parameters:
  ci_action:
    type: enum
    enum: [auto, checks, edge-build, edge-refresh]
    default: auto
orbs:
  continuation: circleci/continuation@0.4.0
  circleci-cli: circleci/circleci-cli@0.1.9
jobs:
  assemble:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - circleci-cli/install
      - run:
          name: Pack latest shared configuration from main
          environment:
            CI_ACTION: << pipeline.parameters.ci_action >>
          command: |
            set -euo pipefail
            shared_dir=$(mktemp -d /tmp/shared-ci.XXXXXX)
            curl -fsSL "https://github.com/dof-dss/webdev-ci/archive/refs/heads/main.tar.gz" \
              | tar -xz --strip-components=1 -C "$shared_dir"
            circleci config pack "$shared_dir/config/application" > /tmp/application-ci.yml
            jq --arg action "$CI_ACTION" '. + {ci_action: $action}' \
              .circleci/application.json > /tmp/application-parameters.json
      - continuation/continue:
          configuration_path: /tmp/application-ci.yml
          parameters: /tmp/application-parameters.json
workflows:
  setup:
    jobs:
      - assemble
